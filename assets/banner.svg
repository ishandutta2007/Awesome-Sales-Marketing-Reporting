<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { r: 4px; opacity: 0.7; }
      50% { r: 7px; opacity: 1; }
    }
    .g-glow { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: 900px 180px; }
    .card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .trend-line { stroke-dasharray: 8, 4; animation: dashLine 25s linear infinite; }
    .beacon { animation: pulseDot 2.5s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Animated Subtle Background Glow Circles -->
  <circle class="g-glow" cx="950" cy="180" r="160" fill="#3b82f6" filter="url(#glow)" />
  <circle class="g-glow" cx="200" cy="80" r="120" fill="#8b5cf6" filter="url(#glow)" style="animation-delay:-3s;" />

  <!-- Background Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Graphic Element 1: Glassmorphic Metric Chart Card (Right Side) -->
  <g class="card-1" transform="translate(820, 45)" filter="url(#cardShadow)">
    <rect width="320" height="150" rx="14" fill="#1e293b" fill-opacity="0.65" stroke="#334155" stroke-width="1.5" />
    <text x="24" y="34" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">REVENUE ATTRIBUTION</text>
    <text x="24" y="66" fill="#f8fafc" font-size="26" font-weight="700">$4,850,200</text>
    <rect x="220" y="20" width="76" height="24" rx="12" fill="#065f46" fill-opacity="0.5" stroke="#10b981" stroke-width="1" />
    <text x="236" y="36" fill="#34d399" font-size="11" font-weight="700">+34.8% ↑</text>
    
    <!-- Mini Bar Chart inside card -->
    <rect x="24" y="105" width="20" height="28" rx="4" fill="url(#barGrad)" />
    <rect x="52" y="95" width="20" height="38" rx="4" fill="url(#barGrad)" />
    <rect x="80" y="82" width="20" height="51" rx="4" fill="url(#barGrad)" />
    <rect x="108" y="90" width="20" height="43" rx="4" fill="url(#barGrad)" />
    <rect x="136" y="72" width="20" height="61" rx="4" fill="url(#barGrad)" />
    <rect x="164" y="60" width="20" height="73" rx="4" fill="url(#accentCyan)" />
    <rect x="192" y="78" width="20" height="55" rx="4" fill="url(#barGrad)" />
    <rect x="220" y="65" width="20" height="68" rx="4" fill="url(#barGrad)" />
    <rect x="248" y="52" width="20" height="81" rx="4" fill="url(#primaryGrad)" />
  </g>

  <!-- Dynamic Graphic Element 2: KPI Secondary Card -->
  <g class="card-2" transform="translate(860, 215)" filter="url(#cardShadow)">
    <rect width="280" height="105" rx="14" fill="#1e293b" fill-opacity="0.65" stroke="#334155" stroke-width="1.5" />
    <circle cx="36" cy="36" r="14" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="31" y="41" fill="#60a5fa" font-size="14" font-weight="bold">⚡</text>
    <text x="62" y="32" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">CAC vs LTV RATIO</text>
    <text x="62" y="52" fill="#f8fafc" font-size="18" font-weight="700">4.2x ROI (Healthy)</text>
    <line x1="24" y1="74" x2="256" y2="74" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="74" x2="200" y2="74" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round"/>
    <text x="24" y="94" fill="#64748b" font-size="10">Ad Spend: $142K</text>
    <text x="180" y="94" fill="#10b981" font-size="10" font-weight="600">Pipeline: $596K</text>
  </g>

  <!-- Flow Curve / Animated Trend Line -->
  <path class="trend-line" d="M 680 290 Q 760 210, 830 250 T 960 170 T 1120 110" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" />
  <circle class="beacon" cx="830" cy="250" r="5" fill="#38bdf8" />
  <circle class="beacon" cx="960" cy="170" r="5" fill="#818cf8" />

  <!-- Hero Content Left Side (Always in foreground, never obscured) -->
  <g transform="translate(70, 75)">
    <!-- Category Badge Pill -->
    <rect width="255" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#10b981" />
    <text x="28" y="20" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Sales &amp; Marketing
    </text>
    <text x="0" y="124" fill="#ffffff" font-size="42" font-weight="900" letter-spacing="-0.5">
      Reporting &amp; Analytics
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="166" fill="#94a3b8" font-size="16" font-weight="400">
      Enterprise SaaS &amp; Open-Source Tools for Cross-Channel Attribution,
    </text>
    <text x="0" y="190" fill="#94a3b8" font-size="16" font-weight="400">
      Pipeline Velocity, Reverse ETL, MMM &amp; Executive KPI Dashboards
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 218)">
      <rect width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="17" fill="#cbd5e1" font-size="11" font-weight="600">📊 SaaS Tiers</text>

      <rect x="115" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="127" y="17" fill="#cbd5e1" font-size="11" font-weight="600">⚡ Open Source</text>

      <rect x="255" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="267" y="17" fill="#cbd5e1" font-size="11" font-weight="600">🎯 ROI &amp; Attribution</text>

      <rect x="410" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="422" y="17" fill="#cbd5e1" font-size="11" font-weight="600">🔄 Reverse ETL</text>
    </g>
  </g>
</svg>
